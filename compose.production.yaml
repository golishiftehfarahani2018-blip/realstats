# Run behind an HTTPS reverse proxy on the same host. Port 8080 stays loopback-only.
services:
  backend:
    restart: unless-stopped
    environment: {DEBUG: '0'}
  frontend:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
    volumes: ['./infra/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro']
  db:
    restart: unless-stopped
  storage:
    restart: unless-stopped
